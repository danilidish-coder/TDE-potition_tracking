name: Publish tested Position Tracking v1.2.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-125-from-validated-rc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout exact tested RC commit
        uses: actions/checkout@v4
        with:
          ref: 33ea13ca2133ddbfb93b1d051d4b25dc35bd954f
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency install failed" }

      - name: Execute regression tests
        shell: pwsh
        run: |
          python -m py_compile src/position_tracking.py src/position_tracking_offline.py src/position_tracking_bootstrap.py
          if ($LASTEXITCODE -ne 0) { throw "Compile failed" }
          $testScripts = @(
            "simulate_officer_simple_flow.py",
            "stress_shift_membership_reversal.py",
            "report_archive_history_regression.py",
            "current_report_retention_regression.py",
            "pdf_report_regression.py",
            "sqlite_shift_archive_regression.py",
            "report_archive_search_regression.py",
            "personnel_history_sqlite_regression.py",
            "communication_control_regression.py",
            "shift_end_release_regression.py",
            "network_resilience_regression.py",
            "shift_smb_lock_concurrency.py",
            "client_lifecycle_regression.py",
            "windows_user_handoff_regression.py",
            "shift_end_actions_regression.py",
            "offline_recovery_integration.py",
            "offline_user_logoff_machine_queue.py",
            "offline_15_clients_restart_stress.py",
            "offline_single_machine_claim_stress.py",
            "start_time_correction_edge_regression.py"
          )
          foreach ($name in $testScripts) {
            python "tests/$name"
            if ($LASTEXITCODE -ne 0) { throw "Regression test failed: $name" }
          }

      - name: Build Windows EXE
        shell: pwsh
        run: |
          python tools/generate_network_icon.py
          if ($LASTEXITCODE -ne 0) { throw "Icon generation failed" }
          python -m PyInstaller --noconfirm --clean --windowed --onefile --icon build_assets/position_tracking_network.ico --name TDE_Katagrafi_Theseon src/position_tracking.py
          if ($LASTEXITCODE -ne 0 -or !(Test-Path dist/TDE_Katagrafi_Theseon.exe)) { throw "Windows build failed" }

      - name: GUI startup smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path dist/TDE_Katagrafi_Theseon.exe) -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "EXE exited during smoke test" }
          Stop-Process -Id $p.Id -Force
          python tests/visual_flicker_windows.py --exe dist/TDE_Katagrafi_Theseon.exe --out visual_flicker
          if ($LASTEXITCODE -ne 0) { throw "Visual test failed" }

      - name: Publish exact-commit release once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v1.2.5"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v1.2.5 already exists; refusing overwrite" }
          Copy-Item dist/TDE_Katagrafi_Theseon.exe TDE_Katagrafi_Theseon.exe
          $hash = (Get-FileHash TDE_Katagrafi_Theseon.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TDE_Katagrafi_Theseon.exe" | Set-Content SHA256SUMS.txt
          $notes = "Windows build from validated RC4 commit 33ea13ca2133ddbfb93b1d051d4b25dc35bd954f. Automated Windows regression, smoke and visual tests passed. On-site SMB/server and multi-booth acceptance remains pending. v1.2.3 preserved. SHA256: $hash"
          gh release create $tag TDE_Katagrafi_Theseon.exe SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target 33ea13ca2133ddbfb93b1d051d4b25dc35bd954f --title "Position Tracking v1.2.5" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
