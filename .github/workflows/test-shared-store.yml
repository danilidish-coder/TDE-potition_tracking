name: Position Tracking Backend and Shared Directory Stress

on:
  push:
    branches: [feature/v125-modularization-20261013]
    paths: ["src/**", "tests/**", "tools/run_regressions.py", ".github/workflows/test-shared-store.yml"]
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/test-shared-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m py_compile src/position_tracking.py
      - name: Full portable regressions including real offscreen Qt
        run: python tools/run_regressions.py --out artifact/regressions
