name: Position Tracking Backend and Shared Directory Stress

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/test-shared-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m py_compile src/position_tracking.py
      - name: Existing regressions
        run: |
          python tests/network_resilience_regression.py
          python tests/shift_smb_lock_concurrency.py
          python tests/client_lifecycle_regression.py
          python tests/windows_user_handoff_regression.py
          python tests/shift_end_actions_regression.py
      - name: Multi-station shortcut and host power-off simulation
        run: python tests/simulated_shared_host_shortcuts.py
      - name: Offline queue recovery and restart stress
        run: |
          python tests/offline_recovery_integration.py
          python tests/offline_user_logoff_machine_queue.py
          python tests/offline_15_clients_restart_stress.py
          python tests/offline_single_machine_claim_stress.py
          python tests/start_time_correction_edge_regression.py
