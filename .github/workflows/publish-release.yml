name: Publish Position Tracking Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VERSION.txt"
      - ".github/workflows/publish-release.yml"

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          TAG="$(tr -d '\r\n ' < VERSION.txt)"
          if [ -z "$TAG" ]; then
            echo "VERSION.txt is empty"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify final Windows EXE
        shell: bash
        run: |
          test -f "release/Καταγραφή Θέσεων.exe"

      - name: Prepare simple download filename
        shell: bash
        run: |
          cp "release/Καταγραφή Θέσεων.exe" "TDE_Katagrafi_Theseon.exe"

      - name: Publish current release and clean superseded data
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Καταγραφή Θέσεων $TAG"
          NOTES="Έτοιμη λειτουργική έκδοση Windows. Κατέβασε μόνο το TDE_Katagrafi_Theseon.exe από τα Assets."

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" "default.exe" -R "$REPO" -y >/dev/null 2>&1 || true
            gh release upload "$TAG" "TDE_Katagrafi_Theseon.exe" -R "$REPO" --clobber
            gh release edit "$TAG" -R "$REPO" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "TDE_Katagrafi_Theseon.exe" -R "$REPO" --title "$TITLE" --notes "$NOTES" --latest
          fi

          echo "Removing superseded releases and their tags..."
          gh release list -R "$REPO" --limit 100 --json tagName --jq '.[].tagName' | while read -r old_tag; do
            [ -z "$old_tag" ] && continue
            if [ "$old_tag" != "$TAG" ]; then
              gh release delete "$old_tag" -R "$REPO" --cleanup-tag -y
            fi
          done

          echo "Removing non-current tags..."
          gh api --paginate "repos/$REPO/git/matching-refs/tags/" --jq '.[].ref' | while read -r ref; do
            [ -z "$ref" ] && continue
            tag="${ref#refs/tags/}"
            if [ "$tag" != "$TAG" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
            fi
          done

          echo "Removing temporary branches..."
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | while read -r branch; do
            [ -z "$branch" ] && continue
            if [ "$branch" != "main" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1 || true
            fi
          done

          echo "Removing old Actions artifacts..."
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
          done

          echo "Repository cleanup complete. Current functional version: $TAG"
