name: Publish Position Tracking Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "VERSION.txt"
      - ".github/workflows/publish-release.yml"

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          TAG="$(tr -d '\r\n ' < VERSION.txt)"
          if [ -z "$TAG" ]; then
            echo "VERSION.txt is empty"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify final Windows EXE
        shell: bash
        run: |
          test -f "release/Καταγραφή Θέσεων.exe"

      - name: Prepare simple download filename
        shell: bash
        run: |
          cp "release/Καταγραφή Θέσεων.exe" "TDE_Katagrafi_Theseon.exe"

      - name: Publish current release and clean superseded data
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE="Καταγραφή Θέσεων $TAG"
          NOTES="Έτοιμη λειτουργική έκδοση Windows. Κατέβασε μόνο το TDE_Katagrafi_Theseon.exe από τα Assets."

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" "default.exe" -R "$REPO" -y >/dev/null 2>&1 || true
            gh release upload "$TAG" "TDE_Katagrafi_Theseon.exe" -R "$REPO" --clobber
            gh release edit "$TAG" -R "$REPO" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "TDE_Katagrafi_Theseon.exe" -R "$REPO" --title "$TITLE" --notes "$NOTES" --latest
          fi

          echo "Release $TAG published. Previous releases, tags, branches and artifacts retained for rollback."
