name: Central-only candidate source gates

on:
  push:
    branches: [feature/central-only-simple-20261027, fix/v127-issue11-20261029]
    paths: ["src/**", "tests/**", "requirements.txt", ".github/workflows/central-only-gates.yml"]
  workflow_dispatch:
    inputs:
      include_linux:
        description: Also run the optional Linux source checks
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  source-gates:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_linux && '["windows-latest","ubuntu-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source test dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - name: Focused central recovery and operator gates
        shell: bash
        run: |
          set -euo pipefail
          python tests/offline_single_machine_claim_stress.py
          python tests/central_officer_regression.py
          python tests/central_officer_ui_regression.py
          python tests/architecture_regression.py
          python tests/live_map_actions_regression.py
          python tests/runtime_diagnostics_regression.py
          python tests/trial_sandbox_regression.py
          python tests/central_shift_separation_regression.py
          python tests/central_shift_ui_regression.py
          python tests/central_handover_regression.py
          python tests/central_handover_ui_regression.py
          python tests/central_stale_worker_regression.py
          python tests/central_end_interruption_regression.py
          python tests/central_position_recovery_regression.py
          python tests/central_operator_regression.py
          python tests/central_operator_ui_regression.py
          python tests/central_load_and_report_warning_regression.py
          python tests/central_operator_load_ui_regression.py
      - name: Full source regressions
        run: python tools/run_regressions.py --out artifact/regressions
      - name: Retain source diagnostics (no EXE)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CENTRAL_SOURCE_GATES-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}
          path: artifact/regressions
          if-no-files-found: ignore
          retention-days: 14

  trial-exe:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[trial-exe]') }}
    needs: source-gates
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build isolated candidate (not approved production)
        shell: pwsh
        run: |
          python tools/generate_network_icon.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon build_assets/position_tracking_network.ico --name TDE_Katagrafi_Theseon_TRIAL src/position_tracking_trial.py
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          if (-not (Test-Path dist/TDE_Katagrafi_Theseon_TRIAL.exe)) { throw 'Missing EXE' }
      - name: Frozen operator and officer startup smoke
        shell: pwsh
        run: |
          $sandbox = Join-Path (Get-Location) 'dist/TDE_TRIAL_SANDBOX'
          New-Item -ItemType Directory -Path (Join-Path $sandbox '.tde_runtime') -Force | Out-Null
          Copy-Item dist/TDE_Katagrafi_Theseon_TRIAL.exe (Join-Path $sandbox 'TDE_Katagrafi_Theseon_TRIAL.exe')
          $exe = (Resolve-Path (Join-Path $sandbox 'TDE_Katagrafi_Theseon_TRIAL.exe')).Path
          foreach ($argument in @('', '--central-officer')) {
            if ($argument) { $p = Start-Process $exe -ArgumentList $argument -PassThru }
            else { $p = Start-Process $exe -PassThru }
            Start-Sleep -Seconds 7
            if ($p.HasExited) { throw "Trial startup failed: $argument" }
            taskkill /PID $p.Id /T /F
            if ($LASTEXITCODE -ne 0) { throw "Trial cleanup failed: $argument" }
            if (-not $p.WaitForExit(15000)) { throw 'Trial process still running' }
          }
          $file = Get-Item $exe
          Write-Host "TRIAL_SOURCE_SHA=${{ github.sha }}"
          Write-Host "TRIAL_EXE_SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash)"
          Write-Host "TRIAL_EXE_BYTES=$($file.Length)"
      - name: Upload isolated trial executable
        uses: actions/upload-artifact@v4
        with:
          name: TDE-TRIAL-${{ github.sha }}-${{ github.run_id }}
          path: dist/TDE_Katagrafi_Theseon_TRIAL.exe
          if-no-files-found: error
          retention-days: 7
