# v1.2.8 candidate gates (Windows source gates + frozen EXE build on [candidate-exe])
name: Central-only candidate source gates

on:
  push:
    branches: [feature/central-only-simple-20261027, fix/v127-issue11-20261029]
    paths: ["src/**", "tests/**", "requirements.txt", ".github/workflows/central-only-gates.yml"]
  workflow_dispatch:
    inputs:
      include_linux:
        description: Also run the optional Linux source checks
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  source-gates:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_linux && '["windows-latest","ubuntu-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source test dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - name: Focused central recovery and operator gates
        shell: bash
        run: |
          set -euo pipefail
          python tests/offline_single_machine_claim_stress.py
          python tests/central_officer_regression.py
          python tests/central_officer_ui_regression.py
          python tests/architecture_regression.py
          python tests/live_map_actions_regression.py
          python tests/runtime_diagnostics_regression.py
          python tests/trial_sandbox_regression.py
          python tests/central_shift_separation_regression.py
          python tests/central_shift_ui_regression.py
          python tests/central_handover_regression.py
          python tests/central_handover_ui_regression.py
          python tests/central_stale_worker_regression.py
          python tests/central_end_interruption_regression.py
          python tests/central_position_recovery_regression.py
          python tests/central_operator_regression.py
          python tests/central_operator_ui_regression.py
          python tests/central_load_and_report_warning_regression.py
          python tests/central_operator_load_ui_regression.py
          python tests/central_main_regression.py
          python tests/central_names_and_legacy_regression.py
      - name: Full source regressions
        run: python tools/run_regressions.py --out artifact/regressions
      - name: Retain source diagnostics (no EXE)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CENTRAL_SOURCE_GATES-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}
          path: artifact/regressions
          if-no-files-found: ignore
          retention-days: 14

  # Isolated sandbox trial only (TDE_TRIAL_SANDBOX). Never a production build.
  trial-exe:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[trial-exe]') }}
    needs: source-gates
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build isolated candidate (not approved production)
        shell: pwsh
        run: |
          python tools/generate_network_icon.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon build_assets/position_tracking_network.ico --name TDE_Katagrafi_Theseon_TRIAL src/position_tracking_trial.py
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          if (-not (Test-Path dist/TDE_Katagrafi_Theseon_TRIAL.exe)) { throw 'Missing EXE' }
      - name: Frozen operator and officer startup smoke
        shell: pwsh
        run: |
          $sandbox = Join-Path (Get-Location) 'dist/TDE_TRIAL_SANDBOX'
          New-Item -ItemType Directory -Path (Join-Path $sandbox '.tde_runtime') -Force | Out-Null
          Copy-Item dist/TDE_Katagrafi_Theseon_TRIAL.exe (Join-Path $sandbox 'TDE_Katagrafi_Theseon_TRIAL.exe')
          $exe = (Resolve-Path (Join-Path $sandbox 'TDE_Katagrafi_Theseon_TRIAL.exe')).Path
          foreach ($argument in @('', '--central-officer')) {
            if ($argument) { $p = Start-Process $exe -ArgumentList $argument -PassThru }
            else { $p = Start-Process $exe -PassThru }
            Start-Sleep -Seconds 7
            if ($p.HasExited) { throw "Trial startup failed: $argument" }
            taskkill /PID $p.Id /T /F
            if ($LASTEXITCODE -ne 0) { throw "Trial cleanup failed: $argument" }
            if (-not $p.WaitForExit(15000)) { throw 'Trial process still running' }
          }
          $file = Get-Item $exe
          Write-Host "TRIAL_SOURCE_SHA=${{ github.sha }}"
          Write-Host "TRIAL_EXE_SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash)"
          Write-Host "TRIAL_EXE_BYTES=$($file.Length)"
      - name: Upload isolated trial executable
        uses: actions/upload-artifact@v4
        with:
          name: TDE-TRIAL-${{ github.sha }}-${{ github.run_id }}
          path: dist/TDE_Katagrafi_Theseon_TRIAL.exe
          if-no-files-found: error
          retention-days: 7

  # Normal (non-sandbox) central-only build for the user's own acceptance test.
  # Status stays CANDIDATE until the user explicitly approves this exact hash.
  candidate-exe:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[candidate-exe]') }}
    needs: source-gates
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      EXE_NAME: TDE_Katagrafi_Theseon_v1.2.8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build central-only candidate (not approved)
        shell: pwsh
        run: |
          python tools/generate_network_icon.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon build_assets/position_tracking_network.ico --version-file tools/windows_version_info_central_v128.txt --name $env:EXE_NAME src/position_tracking_central_main.py
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          if (-not (Test-Path "dist/$($env:EXE_NAME).exe")) { throw 'Missing EXE' }
      - name: Frozen functional self-test on synthetic data
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/$($env:EXE_NAME).exe").Path
          $work = Join-Path $env:RUNNER_TEMP 'tde-frozen-selftest'
          $p = Start-Process $exe -ArgumentList @('--selftest', "`"$work`"") -Wait -PassThru
          $report = Join-Path $work 'selftest_result.json'
          if (-not (Test-Path $report)) { Write-Host "::error title=frozen-selftest::no report written, exit $($p.ExitCode)"; throw "Self-test wrote no report (exit $($p.ExitCode))" }
          $result = Get-Content $report -Raw -Encoding UTF8 | ConvertFrom-Json
          $result.checks | ForEach-Object { Write-Host ("{0} {1} {2}" -f $(if ($_.ok) {'PASS'} else {'FAIL'}), $_.name, $_.detail) }
          $compact = ($result | ConvertTo-Json -Depth 5 -Compress)
          Write-Host "::notice title=frozen-selftest::$compact"
          if ($p.ExitCode -ne 0 -or $result.selftest -ne 'PASS' -or -not $result.frozen) { throw 'Frozen self-test failed' }
      - name: Frozen window startup in an ordinary (non-sandbox) folder
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/$($env:EXE_NAME).exe").Path
          foreach ($mode in @('operator', 'officer')) {
            $dir = Join-Path $env:RUNNER_TEMP "tde-frozen-$mode"
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
            $seed = Start-Process $exe -ArgumentList @('--selftest', "`"$dir`"") -Wait -PassThru
            if ($seed.ExitCode -ne 0) { throw "Synthetic seed failed for $mode" }
            $copy = Join-Path $dir "$($env:EXE_NAME).exe"
            Copy-Item $exe $copy
            if ($mode -eq 'officer') { $p = Start-Process $copy -ArgumentList @('--central-officer') -PassThru }
            else { $p = Start-Process $copy -PassThru }
            $found = $null
            for ($i = 0; $i -lt 50 -and -not $found; $i++) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) { throw "Window process exited early: $mode (exit $($p.ExitCode))" }
              $found = Get-Process | Where-Object { $_.MainWindowTitle -like '*v1.2.8*' } | Select-Object -First 1
            }
            if (-not $found) { throw "No v1.2.8 window appeared: $mode" }
            Write-Host "WINDOW_OK mode=$mode title=$($found.MainWindowTitle)"
            Write-Host "::notice title=window-$mode::title=$($found.MainWindowTitle)"
            taskkill /IM "$($env:EXE_NAME).exe" /T /F | Out-Null
            Start-Sleep -Seconds 3
            if (Get-Process -Name $env:EXE_NAME -ErrorAction SilentlyContinue) { throw "Process still running: $mode" }
          }
      - name: Write manifest and checksums
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/$($env:EXE_NAME).exe").Path
          $file = Get-Item $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          New-Item -ItemType Directory -Path candidate -Force | Out-Null
          Copy-Item $exe candidate/
          $manifest = [ordered]@{
            product = 'TDE Katagrafi Theseon'; version = 'v1.2.8'; entry = 'src/position_tracking_central_main.py'
            status = 'CANDIDATE - NOT APPROVED (awaiting user acceptance of this exact SHA256)'
            file = "$($env:EXE_NAME).exe"; sha256 = $hash; bytes = $file.Length
            source_commit = '${{ github.sha }}'; branch = '${{ github.ref_name }}'
            run_id = '${{ github.run_id }}'; run_attempt = '${{ github.run_attempt }}'
            checks = @('Windows source gates (full regressions)', 'frozen functional self-test', 'frozen operator window startup', 'frozen officer window startup')
            not_run = @('real SMB share', 'multiple physical stations', 'user/shift change on real Windows accounts', 'compatibility of an existing production data folder with v1.2.6 rollback')
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content candidate/MANIFEST.json -Encoding UTF8
          "$hash *$($env:EXE_NAME).exe" | Set-Content candidate/SHA256.txt -Encoding ASCII
          Copy-Item (Join-Path $env:RUNNER_TEMP 'tde-frozen-selftest/selftest_result.json') candidate/selftest_result.json
          Write-Host "CANDIDATE_SOURCE_SHA=${{ github.sha }}"
          Write-Host "CANDIDATE_EXE_SHA256=$hash"
          Write-Host "CANDIDATE_EXE_BYTES=$($file.Length)"
          Write-Host "::notice title=candidate::sha256=$hash bytes=$($file.Length) commit=${{ github.sha }} file=$($env:EXE_NAME).exe"
      - name: Upload candidate (private artifact, 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: TDE-CANDIDATE-v1.2.8-${{ github.sha }}-${{ github.run_id }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 90

  # Re-publishes the ALREADY VERIFIED candidate EXE (no rebuild, hash-checked)
  # as a single NON-ZIPPED artifact, so it downloads as a plain .exe.
  candidate-raw-exe:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[candidate-raw]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_RUN: "40865455189"
      ARTIFACT: TDE-CANDIDATE-v1.2.7-b99c39c04de8fb57e741e8c23fad6ab51f7ae1de-40865455189
      EXPECTED_SHA256: 90550a161923d602ab7c335cb0db7c575009fbda67fccc09dd46569c08175110
      EXPECTED_BYTES: "63435197"
      EXE: TDE_Katagrafi_Theseon_v1.2.7b.exe
    steps:
      - name: Fetch the verified artifact and re-check its identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT" -D candidate
          actual=$(sha256sum "candidate/$EXE" | cut -d' ' -f1)
          size=$(stat -c%s "candidate/$EXE")
          if [ "$actual" != "$EXPECTED_SHA256" ] || [ "$size" != "$EXPECTED_BYTES" ]; then
            echo "::error title=identity-mismatch::sha256=$actual bytes=$size"
            exit 1
          fi
          test "$(head -c2 "candidate/$EXE")" = "MZ"
          echo "::notice title=identity-ok::sha256=$actual bytes=$size"
      - name: Upload the plain EXE (not zipped)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXE }}
          path: candidate/${{ env.EXE }}
          archive: false
          if-no-files-found: error
          retention-days: 90
