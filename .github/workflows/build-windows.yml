name: Build Position Tracking Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "src/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify source and test reports
        shell: powershell
        run: |
          if (-not (Test-Path "src\position_tracking.py")) { throw "Source file missing" }
          python -m py_compile "src\position_tracking.py"
          $r14 = Get-Content "tests\reports\FLEXIBLE_IMPORT_TEST_14_OF_14.txt" -Raw
          $r121 = Get-Content "tests\reports\FLEXIBLE_HARD_STRESS_121_OF_121.txt" -Raw
          $runtime = Get-Content "tests\reports\RUNTIME_SHIFT_CHANGE_TEST.txt" -Raw
          if ($r14 -notmatch "RESULT 14/14") { throw "Import report failed" }
          if ($r121 -notmatch "RESULT 121/121") { throw "Stress report failed" }
          if ($runtime -notmatch "100 sequential shifts stress test: PASS") { throw "Runtime shift report failed" }
          python -c "import json,pathlib; d=json.loads(pathlib.Path(r'tests/reports/INTEGRATED_REGRESSION_STRESS.txt').read_text(encoding='utf-8')); assert d['shifts']==100 and d['pending_blocks']==100 and d['late_accept']==100 and d['exclude']==100 and d['events']==600 and d['charts']>=1"
          python "tests\simulate_officer_simple_flow.py"
          python "tests\stress_shift_membership_reversal.py"
          python "tests\report_archive_history_regression.py"
          python "tests\current_report_retention_regression.py"

      - name: Generate network application icon
        shell: powershell
        run: |
          python "tools\generate_network_icon.py"
          if (-not (Test-Path "build_assets\position_tracking_network.ico")) { throw "Network icon was not created" }

      - name: Build Windows application
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --icon "build_assets\position_tracking_network.ico" --name "PositionTracking_TEST" "src\position_tracking.py"
          if (-not (Test-Path "dist\PositionTracking_TEST.exe")) { throw "EXE was not created" }

      - name: Smoke test launch
        shell: powershell
        run: |
          $exe = Resolve-Path "dist\PositionTracking_TEST.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "Application exited unexpectedly during smoke test" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test PASS"
          Write-Host "EXE SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"

      - name: Visual flicker test
        shell: powershell
        run: |
          python "tests\visual_flicker_windows.py" --exe "dist\PositionTracking_TEST.exe" --out "visual_flicker"

      - name: Upload visual flicker evidence
        uses: actions/upload-artifact@v4
        with:
          name: POSITION_TRACKING_VISUAL_FLICKER
          path: visual_flicker/**
          if-no-files-found: error
          retention-days: 30

      - name: Archive Windows EXE
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\PositionTracking_TEST.exe" "release\PositionTracking_TEST.exe" -Force
          $greekName = -join @(
            [char]0x039A,[char]0x03B1,[char]0x03C4,[char]0x03B1,[char]0x03B3,[char]0x03C1,[char]0x03B1,[char]0x03C6,[char]0x03AE,
            [char]0x0020,[char]0x0398,[char]0x03AD,[char]0x03C3,[char]0x03B5,[char]0x03C9,[char]0x03BD
          )
          $finalPath = Join-Path "release" ($greekName + ".exe")
          Copy-Item "dist\PositionTracking_TEST.exe" $finalPath -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all release
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Archive final Windows EXE"
            git push
          }

      - name: Upload Windows test EXE
        uses: actions/upload-artifact@v4
        with:
          name: POSITION_TRACKING_WINDOWS_TEST
          path: dist/PositionTracking_TEST.exe
          if-no-files-found: error
          retention-days: 30
