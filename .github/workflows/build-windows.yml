name: Build Position Tracking Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "POSITION_TRACKING_OFFICER_FINAL.zip"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify uploaded final ZIP
        shell: powershell
        run: |
          if (-not (Test-Path "POSITION_TRACKING_OFFICER_FINAL.zip")) { throw "Final ZIP not found" }
          $zipHash = (Get-FileHash "POSITION_TRACKING_OFFICER_FINAL.zip" -Algorithm SHA256).Hash.ToLower()
          Write-Host "ZIP SHA256: $zipHash"
          if ($zipHash -ne "33e8adeda50995b6526f25bc28ab883e117e478f207fe1b58eb179b521488cb8") { throw "ZIP SHA256 mismatch" }

      - name: Extract source package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          Expand-Archive -Path "POSITION_TRACKING_OFFICER_FINAL.zip" -DestinationPath "buildsrc" -Force

      - name: Locate source
        shell: powershell
        run: |
          $source = Get-ChildItem buildsrc -Recurse -Filter "position_tracking_FINAL.py" | Select-Object -First 1
          if (-not $source) { throw "position_tracking_FINAL.py not found" }
          "SOURCE_DIR=$($source.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify embedded stress reports
        shell: powershell
        run: |
          $r14 = Get-Content "$env:SOURCE_DIR\FLEXIBLE_IMPORT_TEST_14_OF_14.txt" -Raw
          $r121 = Get-Content "$env:SOURCE_DIR\FLEXIBLE_HARD_STRESS_121_OF_121.txt" -Raw
          $officer = Get-Content "$env:SOURCE_DIR\OFFICER_CHANGE_VERIFICATION.txt" -Raw
          if ($r14 -notmatch "RESULT 14/14") { throw "Import tests not verified" }
          if ($r121 -notmatch "RESULT 121/121") { throw "Hard stress tests not verified" }
          if ($officer -notmatch "15/15 critical functions PASS") { throw "Officer regression not verified" }
          if ($officer -notmatch "100 sequential sessions: PASS") { throw "START END stress not verified" }
          if ($officer -notmatch "Removed PIN/password authentication flow") { throw "No-PIN change not verified" }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:SOURCE_DIR\requirements.txt"

      - name: Source integrity and syntax
        shell: powershell
        run: |
          $actual = (Get-FileHash "$env:SOURCE_DIR\position_tracking_FINAL.py" -Algorithm SHA256).Hash.ToLower()
          Write-Host "SOURCE SHA256: $actual"
          if ($actual -ne "bc964eecda93aa63fad91ff157fd71a4d0c06a3fd0e3510f70bd06247f558a95") { throw "Source SHA256 mismatch" }
          python -m py_compile "$env:SOURCE_DIR\position_tracking_FINAL.py"

      - name: Build Windows application
        shell: powershell
        run: |
          Set-Location "$env:SOURCE_DIR"
          python -m PyInstaller --noconfirm --clean --windowed --name "PositionTracking" "position_tracking_FINAL.py"
          python -c "from pathlib import Path; p=Path('dist/PositionTracking'); (p/'PositionTracking.exe').rename(p/'\u039a\u03b1\u03c4\u03b1\u03b3\u03c1\u03b1\u03c6\u03ae \u0398\u03ad\u03c3\u03b5\u03c9\u03bd.exe')"

      - name: Verify build output
        shell: powershell
        run: |
          $exeFiles = @(Get-ChildItem "$env:SOURCE_DIR\dist" -Filter "*.exe")
          if ($exeFiles.Count -ne 1) { throw "Expected exactly one EXE, found $($exeFiles.Count)" }
          $exe = $exeFiles[0]
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          Write-Host "EXE: $($exe.FullName)"
          Write-Host "EXE SHA256: $hash"
          "EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke test launch
        shell: powershell
        run: |
          $p = Start-Process -FilePath "$env:EXE_PATH" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "Application exited unexpectedly during smoke test" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test PASS"

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: POSITION_TRACKING_WINDOWS_FINAL
          path: ${{ env.SOURCE_DIR }}/dist/*.exe
          if-no-files-found: error
          retention-days: 30
