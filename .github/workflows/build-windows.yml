name: Build Position Tracking Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "audit/**"
    paths:
      - "src/**"
      - "tools/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify source and test reports
        id: regressions
        shell: powershell
        run: |
          if (-not (Test-Path "src\position_tracking.py")) { throw "Source file missing" }
          python -m py_compile "src\position_tracking.py" "src\position_tracking_offline.py" "src\position_tracking_bootstrap.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          $r14 = Get-Content "tests\reports\FLEXIBLE_IMPORT_TEST_14_OF_14.txt" -Raw
          $r121 = Get-Content "tests\reports\FLEXIBLE_HARD_STRESS_121_OF_121.txt" -Raw
          $runtime = Get-Content "tests\reports\RUNTIME_SHIFT_CHANGE_TEST.txt" -Raw
          if ($r14 -notmatch "RESULT 14/14") { throw "Import report failed" }
          if ($r121 -notmatch "RESULT 121/121") { throw "Stress report failed" }
          if ($runtime -notmatch "100 sequential shifts stress test: PASS") { throw "Runtime shift report failed" }
          python -c "import json,pathlib; d=json.loads(pathlib.Path(r'tests/reports/INTEGRATED_REGRESSION_STRESS.txt').read_text(encoding='utf-8')); assert d['shifts']==100 and d['pending_blocks']==100 and d['late_accept']==100 and d['exclude']==100 and d['events']==600 and d['charts']>=1"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\simulate_officer_simple_flow.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\stress_shift_membership_reversal.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\report_archive_history_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\current_report_retention_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\pdf_report_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\sqlite_shift_archive_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\report_archive_search_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\personnel_history_sqlite_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\communication_control_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\shift_end_release_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\network_resilience_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\shift_smb_lock_concurrency.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\client_lifecycle_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\windows_user_handoff_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\shift_end_actions_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\offline_recovery_integration.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\offline_user_logoff_machine_queue.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\offline_15_clients_restart_stress.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\offline_single_machine_claim_stress.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\start_time_correction_edge_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Python regression failed (exit code $LASTEXITCODE)" }
          python "tests\field_handoff_conflict_recovery.py"
          if ($LASTEXITCODE -ne 0) { throw "Field handoff failed ($LASTEXITCODE)" }
          python "tests\field_acceptance_retest_20261010.py"
          if ($LASTEXITCODE -ne 0) { throw "Real exit booth acceptance failed ($LASTEXITCODE)" }
          python "tests\gui_network_stall_retest_20261010.py"
          if ($LASTEXITCODE -ne 0) { throw "Qt event loop stall acceptance failed ($LASTEXITCODE)" }
          python "tests\watchdog_auto_recovery_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "Independent watchdog recovery failed ($LASTEXITCODE)" }
          python "tests\booth_buttons_stall_recovery_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "DISABLED BOOTH BUTTONS FIELD REGRESSION ($LASTEXITCODE)" }
          python "tests\rejected_handoff_repeat_login_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "REPEATED OLD HANDOFF END ON WINDOWS LOGIN ($LASTEXITCODE)" }
          python "tests\central_exe_and_exit_handoff_regression.py"
          if ($LASTEXITCODE -ne 0) { throw "CENTRAL EXE AND EXIT HANDOFF REGRESSION ($LASTEXITCODE)" }
          python "tests\audit_flapping_network_buttons.py"
          if ($LASTEXITCODE -ne 0) { throw "AUDIT: FLAPPING NETWORK STALLS BOOTH CONTROLS ($LASTEXITCODE)" }
          python "tests\field_handoff_conflict_recovery.py"
          if ($LASTEXITCODE -ne 0) { throw "FIELD HANDOFF RECOVERY FAILED (exit code $LASTEXITCODE)" }

      - name: Generate network application icon
        shell: powershell
        run: |
          python "tools\generate_network_icon.py"
          if (-not (Test-Path "build_assets\position_tracking_network.ico")) { throw "Network icon was not created" }

      - name: Build Windows application
        id: build_exe
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --icon "build_assets\position_tracking_network.ico" --name "TDE_Katagrafi_Theseon" "src\position_tracking.py"
          if (-not (Test-Path "dist\TDE_Katagrafi_Theseon.exe")) { throw "EXE was not created" }

      - name: Smoke test actual watchdog GUI child and heartbeat
        id: smoke
        shell: powershell
        run: |
          $exe = Resolve-Path "dist\TDE_Katagrafi_Theseon.exe"
          $env:TDE_POSITION_LOCAL_ROOT = Join-Path $env:TEMP ("TDE_WATCHDOG_" + [Guid]::NewGuid().ToString("N"))
          $p = Start-Process -FilePath $exe -PassThru
          try {
            $watchFolder = Join-Path $env:TDE_POSITION_LOCAL_ROOT "watchdog"
            $beat = $null
            for ($i = 0; $i -lt 45; $i++) {
              if ($p.HasExited) { throw "Watchdog exited before its GUI child launched" }
              $beat = Get-ChildItem -LiteralPath $watchFolder -Filter "*.heartbeat" -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($null -ne $beat) { break }
              Start-Sleep -Seconds 1
            }
            if ($null -eq $beat) { throw "The Windows GUI child never started its Qt heartbeat" }
            $previous = (Get-Item -LiteralPath $beat.FullName).LastWriteTimeUtc
            Start-Sleep -Seconds 4
            $updated = (Get-Item -LiteralPath $beat.FullName).LastWriteTimeUtc
            if ($updated -le $previous) { throw "The GUI heartbeat stopped; watchdog did not run a live UI" }
            if ($p.HasExited) { throw "Watchdog exited unexpectedly" }
            Write-Host "GUI + watchdog smoke test PASS"
            Write-Host "EXE SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Start-Sleep -Seconds 2
          }

      - name: Visual flicker test
        id: visual
        shell: powershell
        run: |
          python "tests\visual_flicker_windows.py" --exe "dist\TDE_Katagrafi_Theseon.exe" --out "visual_flicker"

      - name: Upload visual flicker evidence
        if: ${{ false }} # Disabled: artifact quota / incomplete offline acceptance. Retain step for later gated release.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: POSITION_TRACKING_VISUAL_FLICKER
          path: visual_flicker/**
          if-no-files-found: error
          retention-days: 30

      - name: Archive Windows EXE
        if: github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $greekName = -join @(
            [char]0x039A,[char]0x03B1,[char]0x03C4,[char]0x03B1,[char]0x03B3,[char]0x03C1,[char]0x03B1,[char]0x03C6,[char]0x03AE,
            [char]0x0020,[char]0x0398,[char]0x03AD,[char]0x03C3,[char]0x03B5,[char]0x03C9,[char]0x03BD
          )
          $finalPath = Join-Path "release" ($greekName + ".exe")
          Copy-Item "dist\TDE_Katagrafi_Theseon.exe" $finalPath -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all release
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Archive final Windows EXE"
            git push
          }

      - name: Publish downloadable v1.2.5 Windows EXE
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/shift-recovery-20261009' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v1.2.5-rc4'
          $exe = 'TDE_Katagrafi_Theseon.exe'
          Copy-Item 'dist/TDE_Katagrafi_Theseon.exe' $exe -Force
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $notes = "Windows validation build 1.2.5. Automated tests, stress regression, GUI smoke and visual test passed. Version 1.2.3 remains unchanged. On-site testing with the real SMB server and at least two booths is still required. SHA256: $hash"
          gh release view $tag -R $env:REPO 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Tag $tag already exists. Will not overwrite a released executable."
          }
          gh release create $tag $exe -R $env:REPO --target $env:HEAD_SHA --title 'Position Tracking v1.2.5 - booth validation' --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Publishing test EXE failed.' }
          Write-Host "PUBLISHED_RELEASE_TAG=$tag"
          Write-Host "PUBLISHED_EXE_SHA256=$hash"
          Write-Host "PUBLISHED_EXE_URL=https://github.com/$env:REPO/releases/download/$tag/$exe"

      - name: Upload isolated v1.2.10 Windows EXE central-only
        if: github.ref == 'refs/heads/feature/v1.2.10-central-only-handoff'
        uses: actions/upload-artifact@v4
        with:
          name: TDE_Katagrafi_Theseon_v1.2.10_CENTRAL_ONLY
          path: dist/TDE_Katagrafi_Theseon.exe
          if-no-files-found: error
          retention-days: 7

      - name: Report isolated Windows build outcome to PR 5
        if: ${{ always() && github.ref == 'refs/heads/fix/shift-recovery-20261009' }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "$env:GITHUB_SHA"
          $status = "regressions=${{ steps.regressions.outcome }} | exe=${{ steps.build_exe.outcome }} | smoke=${{ steps.smoke.outcome }} | visual=${{ steps.visual.outcome }}"
          $message = "Automated Windows check for commit $sha -- $status. This is NOT a production-release approval. Physical SMB/power-loss tests are still required."
          gh pr comment 5 -R "$env:GITHUB_REPOSITORY" --body "$message"
