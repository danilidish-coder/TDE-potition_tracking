name: Build Position Tracking Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "POSITION_TRACKING_OFFICER_FINAL.zip"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract source package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          Expand-Archive -Path "POSITION_TRACKING_OFFICER_FINAL.zip" -DestinationPath "buildsrc" -Force
          Get-ChildItem buildsrc -Recurse

      - name: Locate source
        shell: powershell
        run: |
          $source = Get-ChildItem buildsrc -Recurse -Filter "position_tracking_FINAL.py" | Select-Object -First 1
          if (-not $source) { throw "position_tracking_FINAL.py not found" }
          $folder = $source.Directory.FullName
          "SOURCE_DIR=$folder" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Source directory: $folder"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          $req = Get-ChildItem "$env:SOURCE_DIR" -Filter "requirements.txt" | Select-Object -First 1
          if ($req) {
            python -m pip install -r $req.FullName
          } else {
            python -m pip install "PySide6>=6.7" "openpyxl>=3.1"
          }
          python -m pip install "pyinstaller>=6.0"

      - name: Syntax check
        shell: powershell
        run: |
          python -m py_compile "$env:SOURCE_DIR\position_tracking_FINAL.py"

      - name: Build Windows application
        shell: powershell
        run: |
          Set-Location "$env:SOURCE_DIR"
          python -m PyInstaller --noconfirm --clean --windowed --name "Καταγραφή Θέσεων" "position_tracking_FINAL.py"

      - name: Verify build output
        shell: powershell
        run: |
          $exe = Get-ChildItem "$env:SOURCE_DIR\dist" -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Windows EXE was not created" }
          Write-Host "EXE: $($exe.FullName)"
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
          "EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke test launch
        shell: powershell
        run: |
          $p = Start-Process -FilePath "$env:EXE_PATH" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) { throw "Application exited during smoke test with code $($p.ExitCode)" }
          } else {
            Stop-Process -Id $p.Id -Force
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: POSITION_TRACKING_WINDOWS_FINAL
          path: ${{ env.SOURCE_DIR }}/dist/Καταγραφή Θέσεων/
          if-no-files-found: error
          retention-days: 30
